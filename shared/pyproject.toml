[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "foodsave-core"
version = "2.0.0"
description = "Kode bersama FoodSave: preprocessing model dan akses penyimpanan HDFS."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["foodsave_core*"]
